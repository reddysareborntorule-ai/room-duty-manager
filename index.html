<!DOCTYPE html>
<html>
<head>
    <title>Room Duty Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🏠 Room Duty Manager</h1>

    <h2 id="todayDate"></h2>

    <button id="loginBtn">Sign In With Google</button>

    <div id="userInfo"></div>

    <div id="duties">
        <h3>Today's Duties</h3>

        <div class="task" id="cooking"></div>
        <div class="task" id="rice"></div>
        <div class="task" id="dish"></div>
        <div class="task" id="sink"></div>
        <div class="task" id="garbage"></div>
        <div class="task" id="room"></div>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
